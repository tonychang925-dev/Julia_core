name: NO_CRITICAL_FALLBACK_GATE

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  NO_CRITICAL_FALLBACK_GATE:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run NCF gate
        run: python3 tools/no_critical_fallback_gate.py --repo Julia_core --baseline ncf-baseline.json --json > ncf-findings.json
      - name: Run task-card governance parser gate
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main --no-tags
          python3 tools/task_card_governance_gate.py \
            --base-ref origin/main \
            --verify-remote-base \
            --json > task-card-governance-findings.json
      - name: Run control-plane freshness gate
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/control_plane_freshness_gate.py \
            --base-ref origin/main \
            --verify-remote-control-plane \
            --json > control-plane-freshness-findings.json
      - name: Run sabotage tests
        run: python3 -m unittest discover -s tests/governance -p 'test_*.py' -v
      - name: Emit reports
        if: always()
        run: |
          cat ncf-findings.json || true
          cat task-card-governance-findings.json || true
          cat control-plane-freshness-findings.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-findings
          path: |
            ncf-findings.json
            task-card-governance-findings.json
            control-plane-freshness-findings.json
